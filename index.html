<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTech Club Database</title>
    <style>
        body {
            background-color: #000;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            padding: 25px;
            font-size: 15px;
            line-height: 1.5;
            margin: 0;
        }
        #console {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 15px;
            background-color: #00FF00;
            animation: blink 1s step-end infinite;
            margin-left: 5px;
            vertical-align: middle;
        }
        @keyframes blink { 50% { opacity: 0; } }
        
        .mentor { color: #FFFF00; font-weight: bold; } /* 仅 Miss IDA 保持黄色 */
    </style>
</head>
<body>
    <div id="console"></div><span class="cursor"></span>

    <script>
        const consoleEl = document.getElementById("console");
        
        const lines = [
            "> System Booting...",
            "> Loading iTech Club Member Database...",
            "> Authenticating... Success.",
            "> ",
            "> LVL UP Achieved! Miss IDA",
            "> LVL UP Achieved! Shi Le",
            "> LVL UP Achieved! Sathiaraj",
            "> LVL UP Achieved! Zheng Lun",
            "> LVL UP Achieved! Zulhilmi",
            "> LVL UP Achieved! Karan",
            "> LVL UP Achieved! Simon",
            "> LVL UP Achieved! Rishi",
            "> LVL UP Achieved! Dhea",
            "> LVL UP Achieved! Teeyna",
            "> LVL UP Achieved! Keshika",
            "> LVL UP Achieved! Sanjees",
            "> LVL UP Achieved! Tarkeshwaran",
            "> LVL UP Achieved! Izuwan",
            "> LVL UP Achieved! Aravind",
            "> LVL UP Achieved! Pavithren",
            "> LVL UP Achieved! Praveen",
            "> LVL UP Achieved! Dhacaiyani",
            "> LVL UP Achieved! Nurhan",
            "> LVL UP Achieved! Krishna",
            "> LVL UP Achieved! Yuvanesh",
            "> LVL UP Achieved! Yugendiran",
            "> ",
            "> [STATUS]: All members synchronized.",
            "> [MISSION]: Continue to power the future."
        ];

        let lineIdx = 0;
        let charIdx = 0;

        function typeWriter() {
            if (lineIdx < lines.length) {
                let currentLine = lines[lineIdx];

                if (charIdx < currentLine.length) {
                    let char = currentLine.charAt(charIdx);
                    
                    if (currentLine.includes("Miss IDA")) {
                        consoleEl.innerHTML += `<span class="mentor">${char}</span>`;
                    } else {
                        consoleEl.innerHTML += char;
                    }
                    
                    charIdx++;
                    setTimeout(typeWriter, 40);
                } else {
                    consoleEl.innerHTML += "<br>";
                    lineIdx++;
                    charIdx = 0;
                    setTimeout(typeWriter, 200); 
                }
            }
        }

        window.onload = typeWriter;
    </script>
</body>
</html>
